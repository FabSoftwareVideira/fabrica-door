
name: CI/CD

on:
  push:
    branches: [main]

  pull_request:

  # Permite solicitar um novo deploy manualmente
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e validações
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O projeto ainda não possui suíte de testes automatizados.
      # Até sua criação, verificamos a sintaxe de todos os arquivos JS.
      - name: Validar sintaxe JavaScript
        run: |
          find src -type f -name "*.js" -print0 |
            xargs -0 -r -n1 node --check

          node --check entrypoint.sh 2>/dev/null || true

      # Auditoria das dependências de produção
      - name: Auditar dependências
        run: npm audit --omit=dev

      # Verifica se a imagem de produção continua construindo
      - name: Build Docker
        run: |
          docker build \
            --target production \
            -t fabrica-door:ci .

      # Valida o Compose de produção
      - name: Validar Docker Compose
        env:
          PGPASSWORD: ci-password-not-used
          JWT_SECRET: ci-secret-not-used
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            config --quiet

  deploy:
    name: Deploy no Dokploy
    needs: testes

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Evita dois deploys simultâneos
    concurrency:
      group: deploy-producao
      cancel-in-progress: false

    steps:
      - name: Solicitar deploy ao Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}

        run: |
          set -e

          for v in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Defina o secret $v."
              exit 1
            fi
          done

          echo "Solicitando deploy ao Dokploy..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            -X POST \
            "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\"}"

          echo ""
          echo "Deploy solicitado com sucesso."
          echo "Acompanhe o build na aba Deployments do Dokploy."

