{% extends "base.html" %}

{% block title %}Login - {{ SITENAME }}{% endblock %}

{% block content %}
<section class="auth-login-section" aria-labelledby="auth-login-title">
    <div class="container auth-login-container">
        <article class="auth-login-card">
            <h1 id="auth-login-title">Login administrativo</h1>
            <p>Use sua conta do IFC para acessar a área administrativa.</p>

            {% if errorMessage %}
            <div class="auth-login-error" role="alert" aria-live="assertive">
                {{ errorMessage }}
            </div>
            {% endif %}

            <div class="auth-login-actions" style="margin-top:1.5rem; text-align:center;">
                <a class="btn-primary auth-login-submit" href="/auth/google"
                    style="display:inline-flex; align-items:center; justify-content:center; gap:0.6rem; text-decoration:none;">
                    <i class="fab fa-google"></i>
                    Entrar com Google
                </a>
            </div>
        </article>
    </div>
</section>
{% endblock %}
