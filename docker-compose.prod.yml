
services:
  fabrica-door-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    image: fabrica-door:${IMAGE_TAG:-latest}
    restart: unless-stopped

    expose:
      - "${PORT:-8000}"

    env_file:
      - path: .env
        required: false

    environment:
      # Overrides fixos de produção — não alterar
      NODE_ENV: production
      PGHOST: fabrica-door-db

      # Valores configuráveis via .env (ou aba Environment do Dokploy)
      PORT: ${PORT:-8000}
      SITE_NAME: ${SITE_NAME}
      SITE_URL: ${SITE_URL}
      EMAIL_FABRICA: ${EMAIL_FABRICA}
      GOOGLE_ANALYTICS: ${GOOGLE_ANALYTICS:-}
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # PostgreSQL
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-fabrica_door}
      PGUSER: ${PGUSER:-fabrica}
      PGPASSWORD: ${PGPASSWORD:?Configure PGPASSWORD no .env}

      # JWT
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

      # Google OAuth (opcional)
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}

    volumes:
      - fabrica-door-uploads:/app/public/assets/uploads

    networks:
      - default
      - dokploy-network

    depends_on:
      fabrica-door-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT||'8000') + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fabrica-door-db:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${PGDATABASE:-fabrica_door}
      POSTGRES_USER: ${PGUSER:-fabrica}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Configure PGPASSWORD no .env}

    volumes:
      - fabrica-door-db-data:/var/lib/postgresql

      # Executados somente na inicialização de um banco vazio
      - ./src/db/migrations:/docker-entrypoint-initdb.d:ro

    networks:
      - default

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fabrica-door-db-data:
    name: fabrica-door-db-data

  fabrica-door-uploads:
    name: fabrica-door-uploads

networks:
  default:
    driver: bridge

  dokploy-network:
    external: true
